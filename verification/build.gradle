description = '傀儡仓数据包与随包结构的单元验证：JSON 都能解析、引用齐全，随包 NBT 与文档记的 SHA-256 一致。'

dependencies {
    testImplementation libs.junit4
    testImplementation libs.gson
}

test {
    useJUnit()
    // 读 fabric 模块的资源源文件和 wiki，与正式包打进去的、文档里写的是同一份。
    def fabricResources = project(':fabric').file('src/main/resources')
    def wiki = rootProject.file('docs/wiki')
    inputs.dir(fabricResources)
    inputs.dir(wiki)
    systemProperty 'golem.fabricResources', fabricResources.absolutePath
    systemProperty 'golem.wiki', wiki.absolutePath
}
